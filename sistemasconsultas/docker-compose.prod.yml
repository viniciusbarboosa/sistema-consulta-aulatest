services:
  db:
    image: postgres:17
    container_name: pg-agendamento
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: app-consultas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=agendamento;Username=postgres;Password=${DB_PASSWORD}"
      APLICAR_MIGRATIONS: "true"
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
    ports:
      - "80:8080"

volumes:
  pgdata:
  dpkeys: